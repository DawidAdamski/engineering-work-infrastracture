apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: crm-rfm
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:1.118.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: POSTGRES_HOST
              value: postgres.crm-rfm.svc.cluster.local
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: POSTGRES_PASSWORD
            - name: QDRANT_URL
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: QDRANT_URL
            - name: QDRANT_COLLECTION
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: QDRANT_COLLECTION
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: crm-secrets
                  key: OPENAI_API_KEY
            - name: OPENAI_MODEL
              valueFrom:
                configMapKeyRef:
                  name: crm-config
                  key: OPENAI_MODEL
            - name: N8N_HOST
              value: n8n.crm-rfm.svc.cluster.local
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http
            # Increase body size limit (default is 16MB, increase to 50MB for large batches)
            # Value is in MB (not bytes) according to n8n documentation
            - name: N8N_PAYLOAD_SIZE_MAX
              value: "50"  # 50MB (value is in MB, not bytes)
            # Increase Node.js heap size to prevent out of memory errors
            # Node has 4Gi RAM, so we use 3Gi for pod (leave 1Gi for system)
            # Heap size should be less than memory limit
            - name: NODE_OPTIONS
              value: "--max-old-space-size=2560"  # 2.5GB heap (memory limit is 3Gi)
            # Enable persistent storage for workflows
            # n8n stores data in /home/node/.n8n by default
            - name: N8N_USER_FOLDER
              value: /home/node/.n8n
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
          resources:
            requests:
              memory: "3Gi"  # Max 3Gi (node has 4Gi total, leave 1Gi for system)
              cpu: "1000m"
            limits:
              memory: "3Gi"  # Max 3Gi (node has 4Gi total)
              cpu: "2000m"   # Increased from 1000m for better performance
      volumes:
        - name: n8n-storage
          persistentVolumeClaim:
            claimName: n8n-storage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-storage
  namespace: crm-rfm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi  # 10GB for workflows and data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: crm-rfm
  labels:
    app: n8n
  annotations:
    # Assign static IP from MetalLB pool (192.168.10.200-210)
    metallb.universe.tf/loadBalancerIPs: 192.168.10.202
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 5678
      targetPort: 5678
      protocol: TCP
  selector:
    app: n8n

